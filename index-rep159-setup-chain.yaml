%YAML 1.1
# ROS buildfarm index file for the REP-159 setup chain on build.test.ros2.org.
# Reads the rep159-rosdistro index branch rep159-setup-chain, where binext
# releases its own ros_workspace (1.0.4-1) and downstream_bin_a 0.2.0-2,
# whose setup files chain /opt/ros/upstream. index-rep159.yaml keeps reading
# main, and every job generated from it stays as it is. Only binext's
# release jobs (Brel_*, Bsrc_*, Bbin_*) come from this file.
---
distributions:
  binext:
    release_builds:
      default: binext/release-build.yaml
    notification_emails:
    - jrivero@honurobotics.com
jenkins_url: https://build.test.ros2.org
notification_emails:
- jrivero@honurobotics.com
