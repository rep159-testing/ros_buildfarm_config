%YAML 1.1
# ROS buildfarm index file for the REP-159 test harness on build.test.ros2.org.
# Not read by production job generation, which uses index.yaml. Lists the
# three distributions of rep159-testing/rep159-rosdistro. The build names
# follow Lyrical's (lyrical/ci-nightly-release.yaml) wherever a job does the
# same thing, so the jobs are <D>ci__nightly-release_<os>_<code>_<arch>.
# upstream also has a release build: binaries go to repo.test.ros2.org.
---
distributions:
  binext:
    ci_builds:
      nightly-release: binext/ci-nightly-release-local.yaml
    notification_emails:
    - jrivero@honurobotics.com
  srcext:
    ci_builds:
      nightly-release: srcext/ci-nightly-release.yaml
    notification_emails:
    - jrivero@honurobotics.com
  upstream:
    ci_builds:
      nightly-release: upstream/ci-nightly-release.yaml
      release-branches: upstream/ci-release-branches.yaml
      source-branches: upstream/ci-source-branches.yaml
    release_builds:
      default: upstream/release-build-local.yaml
    notification_emails:
    - jrivero@honurobotics.com
  extendable:
    ci_builds:
      nightly-release: extendable/ci-nightly-release-local.yaml
      release-branches: extendable/ci-release-branches-local.yaml
      source-branches: extendable/ci-source-branches-local.yaml
    release_builds:
      default: extendable/release-build-local.yaml
    notification_emails:
    - federico.rossi@creativa77.com.ar
  extendablesrc:
    ci_builds:
      nightly-release: extendablesrc/ci-nightly-release-local.yaml
    notification_emails:
    - federico.rossi@creativa77.com.ar
  extendablebin:
    ci_builds:
      nightly-release: extendablebin/ci-nightly-release-local.yaml
    notification_emails:
    - federico.rossi@creativa77.com.ar
jenkins_url: http://192.168.30.206:8080
notification_emails:
- federico.rossi@creativa77.com.ar
prerequisites:
  debian_repositories:
  - http://192.168.30.202:8088/ubuntu/building
  - http://repo.test.ros2.org/ubuntu/building
