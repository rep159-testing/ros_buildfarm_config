%YAML 1.1
# REP-159 harness, binext: extends upstream with binary_import. Only
# downstream_bin_a is built; upstream_c, upstream_b and upstream_a come as
# the binaries upstream releases (ros-upstream-*, under /opt/ros/upstream),
# installed by rosdep from repo.test.ros2.org testing.
# Nothing puts /opt/ros/upstream on the build's search paths: ros_buildfarm
# only sources /opt/ros/binext/setup.sh, which does not exist. Expected red
# at find_package(upstream_c).
# Named after Lyrical's nightly-release: it builds from source every package
# binext owns; no schedule: triggered by hand.
---
build_tool: colcon
build_tool_args: '--cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON --no-warn-unused-cli'
build_tool_test_args: '--retest-until-pass 2 --ctest-args -LE xfail --pytest-args -m "not xfail"'
build_environment_variables:
  ROSDISTRO_INDEX_URL: 'https://raw.githubusercontent.com/rep159-testing/rep159-rosdistro/feat/install-rule/index-v4.yaml'
jenkins_job_label: ci-agent
jenkins_job_priority: 200
jenkins_job_timeout: 120  # first run builds every Docker image cold
repository_names:
- downstream_bin_a
