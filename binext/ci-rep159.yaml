%YAML 1.1
# REP-159 harness, binext: extends ROS 2 Lyrical with binary_import. Only
# downstream_bin_a is built; rcl and everything below it are the live
# ros-lyrical-* debs, installed by rosdep and sourced from /opt/ros/lyrical.
---
build_tool: colcon
build_tool_args: '--cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON --no-warn-unused-cli'
build_tool_test_args: '--retest-until-pass 2 --ctest-args -LE xfail --pytest-args -m "not xfail"'
build_environment_variables:
  ROSDISTRO_INDEX_URL: 'https://raw.githubusercontent.com/rep159-testing/rep159-rosdistro/main/index-v4.yaml'
jenkins_job_label: ci-agent
jenkins_job_priority: 200
jenkins_job_timeout: 120  # first run builds every Docker image cold
repository_names:
- downstream_bin_a
