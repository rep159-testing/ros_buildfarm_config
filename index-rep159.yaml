%YAML 1.1
# ROS buildfarm index file for the REP-159 test harness on build.test.ros2.org.
# Not read by production job generation, which uses index.yaml. Lists the
# three distributions of rep159-testing/rep159-rosdistro. The build names
# follow Lyrical's (lyrical/ci-nightly-release.yaml) wherever a job does the
# same thing, so the jobs are <D>ci__nightly-release_<os>_<code>_<arch>.
---
distributions:
  binext:
    ci_builds:
      nightly-release: binext/ci-nightly-release.yaml
    notification_emails:
    - jrivero@honurobotics.com
  srcext:
    ci_builds:
      nightly-release: srcext/ci-nightly-release.yaml
    notification_emails:
    - jrivero@honurobotics.com
  upstream:
    ci_builds:
      nightly-release: upstream/ci-nightly-release.yaml
      release-branches: upstream/ci-release-branches.yaml
      source-branches: upstream/ci-source-branches.yaml
    notification_emails:
    - jrivero@honurobotics.com
jenkins_url: https://build.test.ros2.org
notification_emails:
- jrivero@honurobotics.com
prerequisites:
rosdistro_index_url: https://raw.githubusercontent.com/rep159-testing/rep159-rosdistro/main/index-v4.yaml
type: buildfarm
version: 1
